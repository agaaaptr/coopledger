services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coopledger
      POSTGRES_USER: coopledger
      POSTGRES_PASSWORD: coopledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/coopledger
      DB_USERNAME: coopledger
      DB_PASSWORD: coopledger
      JWT_SECRET: local-dev-secret-change-me-0123456789abcdef
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
